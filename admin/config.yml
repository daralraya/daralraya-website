backend:
  name: git-gateway
  branch: main

locale: "ar"

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "books_collection"
    label: "إدارة الكتب"
    files:
      - name: "books"
        label: "قائمة الكتب"
        file: "content/books.json"
        fields:
          - name: "books_list"
            label: "الكتب"
            widget: "list"
            fields:
              - {label: "عنوان الكتاب (عربي)", name: "title", widget: "string"}
              - {label: "Title (English)", name: "title_en", widget: "string"}
              - {label: "اسم المؤلف (عربي)", name: "author", widget: "string"}
              - {label: "Author (English)", name: "author_en", widget: "string"}
              - {label: "السعر (د.ا)", name: "price", widget: "number", value_type: "float"}
              - {label: "صورة الغلاف", name: "cover_image", widget: "image", required: false}
              - {label: "لون الغلاف (اختياري)", name: "cover_color", widget: "color", default: "#1E3A8A"}

  - name: "settings"
    label: "تصميم الموقع (تجربة البوربوينت)"
    files:
      - name: "general"
        label: "الإعدادات العامة والتصميم المرئي"
        file: "content/settings.json"
        fields:
          - label: "ترتيب الأقسام"
            name: "section_order"
            widget: "list"
            fields:
              - {label: "القسم", name: "id", widget: "select", options: ["home", "books", "about", "contact"]}
          
          - label: "الألوان الملكية"
            name: "colors"
            widget: "object"
            fields:
              - {label: "خلفية الهيدر (أزرق)", name: "primary_color", widget: "color", default: "#1E3A8A"}
              - {label: "لون النصوص والحدود (ذهبي)", name: "secondary_color", widget: "color", default: "#F1C40F"}

          - label: "تنسيق الخطوط"
            name: "fonts"
            widget: "object"
            fields:
              - {label: "خط العناوين", name: "heading_font", widget: "select", options: ["Aref Ruqaa", "Tajawal", "Cairo", "Amiri"]}
              - {label: "حجم خط العناوين", name: "heading_size", widget: "number", default: 38}
              - {label: "خط النصوص", name: "text_font", widget: "select", options: ["Tajawal", "Cairo", "Amiri"]}
              - {label: "حجم خط النصوص", name: "text_size", widget: "number", default: 18}

          - label: "معلومات التواصل (أرقام دقيقة)"
            name: "contact"
            widget: "object"
            fields:
              - {label: "هاتف أرضي 1", name: "phone_1", widget: "string"}
              - {label: "هاتف أرضي 2", name: "phone_2", widget: "string"}
              - {label: "محمول", name: "phone_3", widget: "string"}
              - {label: "واتساب", name: "whatsapp", widget: "string"}
              - {label: "رابط فيسبوك", name: "facebook_url", widget: "string"}
              - {label: "إيميل ياهو", name: "email_yahoo", widget: "string"}
              - {label: "إيميل العمل", name: "email_ceo", widget: "string"}

          - label: "المحتوى (عربي)"
            name: "content_ar"
            widget: "object"
            fields:
              - {label: "عنوان الهيدر (نصي)", name: "hero_title", widget: "string"}
              - {label: "وصف الهيرو", name: "hero_subtitle", widget: "text"}
              - {label: "عن الدار", name: "about_text", widget: "text"}

          - label: "Content (English)"
            name: "content_en"
            widget: "object"
            fields:
              - {label: "Hero Title", name: "hero_title", widget: "string"}
              - {label: "Hero Subtitle", name: "hero_subtitle", widget: "text"}
              - {label: "About Text", name: "about_text", widget: "text"}
