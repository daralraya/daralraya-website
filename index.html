<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دار الراية للنشر والتوزيع</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Cairo:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style id="dynamicStyles">
  :root{
    --ink:#1E3A8A;
    --gold:#F1C40F;
    --text-color:#ffffff;
    --heading-font: 'Aref Ruqaa', serif;
    --text-font: 'Tajawal', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:#f4f4f4; color:#333; font-family:var(--text-font); direction:rtl;
  }
  header{
    background:var(--ink); border-bottom:4px solid var(--gold); padding:20px 0; position:sticky; top:0; z-index:100;
  }
  .header-content{
    max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; padding:0 24px;
  }
  .logo-container{
    display:flex; align-items:center; gap:15px;
  }
  .logo-circle{
    width:65px; height:65px; border-radius:50%; border:2px solid var(--gold); object-fit:cover;
  }
  .logo-text-img{
    height:55px; 
    filter: brightness(0) saturate(100%) invert(88%) sepia(59%) font-size:20px; 
    /* هذا الفلتر يحول اللون الأبيض إلى ذهبي مشرق يتناسب مع الثيم الملكي */
    filter: invert(82%) sepia(53%) saturate(634%) hue-rotate(357deg) brightness(101%) contrast(92%);
  }
  nav{ display:flex; align-items:center; }
  nav a{
    color:var(--gold); margin-right:25px; font-weight:700; font-size:20px; transition:color 0.3s;
  }
  .lang-toggle{
    background:none; border:2px solid var(--gold); color:var(--gold); 
    padding:5px 10px; border-radius:20px; cursor:pointer; font-weight:bold;
    margin-right:20px; display:flex; align-items:center; gap:5px;
  }
  .lang-toggle:hover{ background:var(--gold); color:var(--ink); }
  nav a:hover{ color:#fff; }
  
  .hero{
    background:var(--ink); color:#fff; padding:100px 24px; text-align:center;
  }
  .hero h1{ font-family:var(--heading-font); font-size:60px; color:var(--gold); margin-bottom:20px; }
  .hero p{ font-size:24px; max-width:800px; margin:0 auto; line-height:1.6; }

  .section-title{
    text-align:center; font-family:var(--heading-font); font-size:48px; color:var(--ink); margin:60px 0 40px;
  }
  .books-grid{
    max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:30px; padding:0 24px;
  }
  .book-card{
    background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 10px 20px rgba(0,0,0,0.1); transition:transform 0.3s;
  }
  .book-card:hover{ transform:translateY(-10px); }
  .book-cover{ height:350px; background-size:cover; background-position:center; background-color:var(--ink); display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; text-align:center; padding:20px; }
  .book-info{ padding:20px; text-align:center; }
  .book-info h3{ margin:0 0 10px; color:var(--ink); }
  .book-price{ color:#e67e22; font-weight:bold; font-size:20px; }

  footer{
    background:#2c3e50; color:#ecf0f1; padding:60px 24px; margin-top:80px;
  }
  .footer-grid{
    max-width:1200px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:40px;
  }
  .footer-col h4{ color:var(--gold); margin-bottom:20px; font-size:22px; }
  .footer-col p{ margin:10px 0; font-size:18px; line-height:1.6; }
  .social-link{ color:var(--gold); text-decoration:underline; }
</style>
</head>
<body>

<header>
  <div class="header-content">
    <div class="logo-container">
      <img src="assets/logo.png" class="logo-circle" alt="شعار دار الراية">
      <img src="assets/dar_logo_text_transparent.png" class="logo-text-img" alt="دار الراية للنشر والتوزيع">
    </div>
    <nav>
      <button class="lang-toggle" onclick="toggleLang()">🌍 EN</button>
      <a href="#home">الرئيسية</a>
      <a href="#books">الكتب</a>
      <a href="#about">عن الدار</a>
      <a href="#contact">تواصل معنا</a>
    </nav>
  </div>
</header>

<div id="mainContent">
  <!-- سيتم تحميل الأقسام هنا -->
</div>

<footer id="contact">
  <div class="footer-grid" id="footerGrid">
    <!-- سيتم تحميل الفوتر هنا -->
  </div>
</footer>

<script>
let currentLang = 'ar';
let siteSettings = {};

async function loadSite() {
  siteSettings = await fetch('content/settings.json').then(r => r.json());
  renderSite();
}

function renderSite() {
  const html = document.documentElement;
  const isAr = currentLang === 'ar';
  const content = isAr ? siteSettings.content_ar : siteSettings.content_en;
  const c = siteSettings.contact;

  html.setAttribute('lang', currentLang);
  html.setAttribute('dir', isAr ? 'rtl' : 'ltr');
  document.querySelector('.lang-toggle').innerText = isAr ? '🌍 EN' : '🌍 AR';
  
  // تحديث النوافذ
  const nav = document.querySelector('nav');
  nav.innerHTML = `
    <button class="lang-toggle" onclick="toggleLang()">${isAr ? '🌍 EN' : '🌍 AR'}</button>
    <a href="#home">${isAr ? 'الرئيسية' : 'Home'}</a>
    <a href="#books">${isAr ? 'الكتب' : 'Books'}</a>
    <a href="#about">${isAr ? 'عن الدار' : 'About'}</a>
    <a href="#contact">${isAr ? 'تواصل معنا' : 'Contact'}</a>
  `;

  const container = document.getElementById('mainContent');
  container.innerHTML = ''; // تنظيف

  siteSettings.section_order.forEach(sec => {
    const section = document.createElement('div');
    section.id = sec.id;
    
    if(sec.id === 'home') {
      section.className = 'hero';
      section.innerHTML = `
        <h1>${content.hero_title}</h1>
        <p>${content.hero_subtitle}</p>
      `;
    } else if(sec.id === 'books') {
      section.innerHTML = `<h2 class="section-title">${isAr ? 'إصداراتنا' : 'Our Publications'}</h2><div class="books-grid" id="booksGrid">...</div>`;
      loadBooks();
    } else if(sec.id === 'about') {
      section.innerHTML = `
        <h2 class="section-title">${isAr ? 'عن الدار' : 'About Us'}</h2>
        <div style="max-width:800px; margin:0 auto; padding:0 24px; font-size:22px; line-height:1.8; text-align:${isAr ? 'center' : 'left'};">
          ${content.about_text}
        </div>
      `;
    }
    container.appendChild(section);
  });

  // تحديث الفوتر
  document.getElementById('footerGrid').innerHTML = `
    <div class="footer-col">
      <h4>${isAr ? 'عن الدار' : 'About Us'}</h4>
      <p>${content.about_text}</p>
    </div>
    <div class="footer-col">
      <h4>${isAr ? 'اتصل بنا' : 'Contact Us'}</h4>
      <p>📞 ${isAr ? 'هاتف' : 'Phone'}: <span dir="ltr">${c.phone_1}</span></p>
      <p>📞 ${isAr ? 'هاتف' : 'Phone'}: <span dir="ltr">${c.phone_2}</span></p>
      <p>📱 ${isAr ? 'محمول' : 'Mobile'}: <span dir="ltr">${c.phone_3}</span></p>
      <p>💬 ${isAr ? 'واتساب' : 'WhatsApp'}: <span dir="ltr">${c.whatsapp}</span></p>
    </div>
    <div class="footer-col">
      <h4>${isAr ? 'روابط' : 'Links'}</h4>
      <p>📧 ${c.email_ceo}</p>
      <p>📍 ${c.location}</p>
      <a href="${c.facebook_url}" class="social-link" target="_blank">${isAr ? 'صفحة الفيسبوك' : 'Facebook Page'}</a>
    </div>
  `;
}

async function loadBooks() {
  try {
    const data = await fetch('content/books.json').then(r => r.json());
    const grid = document.getElementById('booksGrid');
    const isAr = currentLang === 'ar';
    
    if (!data.books_list || data.books_list.length === 0) {
      grid.innerHTML = `<p style="text-align:center; grid-column: 1/-1;">${isAr ? 'لا توجد كتب حالياً' : 'No books available'}</p>`;
      return;
    }
    
    grid.innerHTML = data.books_list.map(book => `
      <div class="book-card">
        <div class="book-cover" style="background-color: ${book.cover_color || 'var(--ink)'}; background-image: url('${book.cover_image || ''}')">
          ${!book.cover_image ? (isAr ? book.title : book.title_en) : ''}
        </div>
        <div class="book-info">
          <h3>${isAr ? book.title : book.title_en}</h3>
          <p>${isAr ? 'المؤلف' : 'Author'}: ${isAr ? book.author : book.author_en}</p>
          <div class="book-price">${book.price} JOD</div>
          <a href="https://wa.me/${siteSettings.contact.whatsapp.replace(/\s+/g, '')}?text=Order: ${isAr ? book.title : book.title_en}" target="_blank" style="display:inline-block; margin-top:15px; padding:10px 20px; background:#25D366; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold;">${isAr ? 'اطلب الآن' : 'Order Now'}</a>
        </div>
      </div>
    `).join('');
  } catch(e) {
    console.error(e);
  }
}

function toggleLang() {
  currentLang = currentLang === 'ar' ? 'en' : 'ar';
  renderSite();
}

loadSite();
</script>
</body>
</html>
